name: Build and Release

# Unsigned release pipeline for the ExplorerTabPlus fork.
# Upstream signed artifacts through SignPath; this fork has no signing certificate,
# so binaries and the installer are published unsigned.
#
# Asset names intentionally keep the "ExplorerTabUtility_<version>_<arch>_<runtime>.zip"
# pattern: the in-app updater (UpdateManager.FindMatchingUpdateAssetUrl) parses it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string to use (e.g., v2.6.0-test). Manual runs never publish a release.'
        required: true
        type: string
        default: 'v0.0.0-test'

env:
  PROJECT_NAME: ExplorerTabUtility
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        framework: [ 'net9.0-windows', 'net481' ]
        arch: [ 'x64', 'x86', 'arm64' ]
      fail-fast: true
      max-parallel: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Project
        run: |
          $outputDir = "../publish/${{ matrix.framework }}/${{ matrix.arch }}"
          msbuild "${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj" /restore /t:Publish /p:Configuration=Release /p:TargetFramework=${{ matrix.framework }} /p:RuntimeIdentifier=win-${{ matrix.arch }} /p:PublishDir=$outputDir /p:DebugType=none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Zip Artifacts
        id: zip_artifacts
        run: |
          $frameworkName = if ("${{ matrix.framework }}" -eq "net9.0-windows") { "Net9.0_FrameworkDependent" } else { "NetFW4.8.1" }
          $zipName = "${{ env.PROJECT_NAME }}_${{ env.VERSION }}_${{ matrix.arch }}_${frameworkName}.zip"

          # Zip root is a single PROJECT_NAME folder (the installer and updater expect this layout)
          $tempDir = "temp-$(New-Guid)"
          New-Item -Path "$tempDir/${{ env.PROJECT_NAME }}" -ItemType Directory -Force | Out-Null
          Copy-Item -Path "publish/${{ matrix.framework }}/${{ matrix.arch }}/*" -Destination "$tempDir/${{ env.PROJECT_NAME }}" -Recurse
          Compress-Archive -Path "$tempDir/*" -DestinationPath $zipName
          Remove-Item -Path $tempDir -Recurse -Force

          echo "zipName=$zipName" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip_artifacts.outputs.zipName }}
          path: ${{ steps.zip_artifacts.outputs.zipName }}

  build-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ env.VERSION }}" `
            /DSourceDir="..\artifacts" `
            "installers\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}_${{ env.VERSION }}_Setup
          path: artifacts/*.exe

  create-release:
    needs: [ build, build-installer ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare release notes
        id: notes
        run: |
          notes=".github/release-notes/${VERSION}.md"
          if [ ! -f "$notes" ]; then
            notes="release-notes-generated.md"
            printf 'Release %s\n\nSee the commit history for changes.\n' "$VERSION" > "$notes"
          fi
          {
            cat "$notes"
            printf '\n\n---\n\n**Not sure which file to download?** Use [%s](https://github.com/%s/releases/download/%s/%s).\n' \
              "${PROJECT_NAME}_${VERSION}_Setup.exe" "${GITHUB_REPOSITORY}" "${VERSION}" "${PROJECT_NAME}_${VERSION}_Setup.exe"
          } > release-body.md
          echo "path=release-body.md" >> "$GITHUB_OUTPUT"
          ls -la release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ExplorerTabPlus ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ !contains(env.VERSION, '-') }}
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.zip
            release-artifacts/*.exe
